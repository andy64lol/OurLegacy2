<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki — Our Legacy 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0e0e12;
            color: #c8c0aa;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .box {
            max-width: 420px;
            background: rgba(255,255,255,0.04);
            border: 1px dashed #c8a84b55;
            border-radius: 10px;
            padding: 40px 36px;
        }
        .icon { font-size: 48px; margin-bottom: 18px; }
        h1 {
            font-size: 22px;
            color: #c8a84b;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #8a8070;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            padding: 9px 24px;
            background: rgba(200,168,75,0.12);
            border: 1px solid #c8a84b55;
            color: #c8a84b;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            letter-spacing: 0.04em;
            transition: background 0.2s;
        }
        a:hover { background: rgba(200,168,75,0.22); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon"><img src="/game_assets/glyphs/book.webp" alt="wiki" style="width:48px;height:48px;"></div>
        <h1>Wiki Unavailable</h1>
        <p>The wiki is currently under construction and only accessible to administrators.<br>Check back once it's ready for all adventurers.</p>
        <a href="/">&#8592; Back to Main Menu</a>
    </div>
</body>
</html>
