<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Our Legacy 2</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>window._chatUser = {{ online_username | tojson }};</script>
    <style>
        [v-cloak] { display: none !important; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { background: var(--bg-main); color: var(--text-light); font-family: 'Tiny5', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #chat-widget-wrap { display: flex; flex-direction: column; height: 100%; }
        .chat-online-bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 32px; }
        .online-pill { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,0.07); border: 1px solid var(--border); display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
        .online-pill.is-self { border-color: rgba(200,160,60,0.45); color: var(--gold); }
        .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-bright); flex-shrink: 0; }
        .mod-hint { padding: 4px 10px; background: rgba(200,140,40,0.08); border-bottom: 1px solid rgba(200,140,40,0.15); font-size: 10px; color: rgba(200,140,40,0.7); flex-shrink: 0; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
        .chat-msg { max-width: 88%; display: flex; flex-direction: column; }
        .chat-msg.msg-self { align-self: flex-end; }
        .chat-msg.msg-system { align-self: center; max-width: 100%; }
        .chat-msg.msg-emote { align-self: center; max-width: 100%; }
        .chat-bubble { padding: 5px 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; word-break: break-word; }
        .msg-other .chat-bubble { background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 10px 10px 10px 2px; }
        .msg-self .chat-bubble { background: rgba(200,160,60,0.14); border: 1px solid rgba(200,160,60,0.25); border-radius: 10px 10px 2px 10px; }
        .msg-system .chat-bubble { background: rgba(255,255,255,0.04); border: none; color: var(--text-dim); font-size: 11px; font-style: italic; text-align: center; padding: 3px 8px; border-radius: 6px; }
        .msg-emote .chat-bubble { background: rgba(180,130,255,0.08); border: 1px solid rgba(180,130,255,0.18); color: var(--exp-purple); font-style: italic; text-align: center; }
        .chat-meta { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
        .msg-self .chat-meta { text-align: right; }
        .msg-self .chat-meta .chat-name { color: var(--gold); }
        .chat-name { color: var(--text-light); font-weight: 700; }
        .chat-name.is-owner { color: #ffcc44; }
        .chat-name.is-admin { color: #88aaff; }
        .chat-input-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); flex-shrink: 0; background: rgba(255,255,255,0.02); }
        .glyph-btn { width: 30px; height: 30px; flex-shrink: 0; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .glyph-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-light); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--text-light); font-family: inherit; font-size: 12px; padding: 6px 10px; outline: none; transition: border-color 0.15s; }
        .chat-input:focus { border-color: rgba(200,160,60,0.5); }
        .chat-send-btn { padding: 6px 14px; background: rgba(200,160,60,0.15); border: 1px solid rgba(200,160,60,0.35); border-radius: 6px; color: var(--gold); font-family: inherit; font-size: 11px; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; }
        .chat-send-btn:hover { background: rgba(200,160,60,0.28); }
        .glyph-picker { position: absolute; bottom: 52px; left: 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: grid; grid-template-columns: repeat(8, 30px); gap: 4px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .glyph-opt { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; border: 1px solid transparent; }
        .glyph-opt:hover { background: rgba(255,255,255,0.1); border-color: var(--border); }
        .glyph-opt img { width: 20px; height: 20px; image-rendering: pixelated; }
        .chat-cooldown { font-size: 10px; color: var(--text-dim); text-align: center; padding: 2px 0; }
        .chat-wrap-pos { position: relative; }
    </style>
</head>
<body>
<div id="chat-widget-vue" v-cloak>
<div id="chat-widget-wrap">
    <div class="chat-online-bar">
        <span v-for="u in onlineUsers" :key="u.username"
              class="online-pill"
              :class="{ 'is-self': u.username === myUsername }">
            <span class="online-dot"></span>
            <img v-if="u.is_owner" src="/game_assets/glyphs/crown.webp" alt="owner" style="width:10px;height:10px;image-rendering:pixelated;">
            <img v-else-if="u.is_admin" src="/game_assets/glyphs/shield.webp" alt="admin" style="width:10px;height:10px;image-rendering:pixelated;">
            [[ u.username ]]
        </span>
    </div>

    <div v-if="isModOrOwner" class="mod-hint">
        /kick &lt;user&gt; &nbsp;/mute &lt;user&gt; &nbsp;/ban &lt;user&gt; &nbsp;/clear
    </div>

    <div class="chat-messages" ref="msgArea">
        <div v-for="(msg, i) in messages" :key="i"
             class="chat-msg"
             :class="msgClass(msg)">
            <div v-if="msg.type !== 'system' && msg.type !== 'emote'" class="chat-meta">
                <span class="chat-name"
                      :class="{ 'is-owner': msg.is_owner, 'is-admin': msg.is_admin }">
                    [[ msg.username ]]
                </span>
                <span v-if="msg.ts"> &bull; [[ msg.ts ]]</span>
            </div>
            <div class="chat-bubble" v-html="renderMsg(msg.text)"></div>
        </div>
    </div>

    <div v-if="cooldownSecs > 0" class="chat-cooldown">
        Please wait [[ cooldownSecs ]]s before sending another message
    </div>

    <div class="chat-wrap-pos">
        <div v-if="showGlyphPicker" class="glyph-picker">
            <div v-for="g in glyphs" :key="g" class="glyph-opt" @click="insertGlyph(g)">
                <img :src="'/game_assets/glyphs/' + g + '.webp'" :alt="g">
            </div>
        </div>
    </div>

    <div class="chat-input-row">
        <button class="glyph-btn" @click="showGlyphPicker = !showGlyphPicker" title="Glyphs">+</button>
        <input class="chat-input" ref="chatInput"
               v-model="inputText"
               @keydown.enter="chatSend"
               placeholder="Say something..."
               maxlength="280"
               autocomplete="off">
        <button class="chat-send-btn" @click="chatSend">Send</button>
    </div>
</div>
</div>

<script src="/static/js/vue/chat_widget.js"></script>
</body>
</html>
