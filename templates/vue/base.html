<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Our Legacy 2{% endblock %}</title>
    <link rel="icon" href="/game_assets/game_title_our_legacy_2.webp" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] { display: none !important; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div id="page-loader">
        <img src="/game_assets/game_title_main_menu.webp" alt="Our Legacy 2" id="page-loader-logo">
        <div class="loader">
            <div class="box box0"><div></div></div>
            <div class="box box1"><div></div></div>
            <div class="box box2"><div></div></div>
            <div class="box box3"><div></div></div>
            <div class="box box4"><div></div></div>
            <div class="box box5"><div></div></div>
            <div class="box box6"><div></div></div>
            <div class="box box7"><div></div></div>
            <div class="ground"><div></div></div>
        </div>
    </div>
    <style>
        #page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0a0614;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }
        #page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #page-loader-logo {
            width: 220px;
            max-width: 60vw;
            image-rendering: pixelated;
            opacity: 0.92;
        }
        .loader {
            --duration: 1.4s;
            --primary: rgb(160, 110, 30);
            --primary-light: #c8a050;
            --primary-rgba: rgba(160, 110, 30, 0);
            width: 200px;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
        }
        @media (max-width: 480px) { .loader { zoom: 0.44; } }
        .loader:before, .loader:after {
            --r: 20.5deg;
            content: "";
            width: 320px;
            height: 140px;
            position: absolute;
            right: 32%;
            bottom: -11px;
            background: #0a0614;
            transform: translateZ(200px) rotate(var(--r));
            animation: mask var(--duration) linear forwards infinite;
        }
        .loader:after { --r: -20.5deg; right: auto; left: 32%; }
        .loader .ground {
            position: absolute;
            left: -50px;
            bottom: -120px;
            transform-style: preserve-3d;
            transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1);
        }
        .loader .ground div {
            transform: rotateX(90deg) rotateY(0deg) translate(-48px, -120px) translateZ(100px) scale(0);
            width: 200px;
            height: 200px;
            background: var(--primary);
            background: linear-gradient(45deg, var(--primary) 0%, var(--primary) 50%, var(--primary-light) 50%, var(--primary-light) 100%);
            transform-style: preserve-3d;
            animation: ground var(--duration) linear forwards infinite;
        }
        .loader .ground div:before, .loader .ground div:after {
            --rx: 90deg; --ry: 0deg; --x: 44px; --y: 162px; --z: -50px;
            content: "";
            width: 156px;
            height: 300px;
            opacity: 0;
            background: linear-gradient(var(--primary), var(--primary-rgba));
            position: absolute;
            transform: rotateX(var(--rx)) rotateY(var(--ry)) translate(var(--x), var(--y)) translateZ(var(--z));
            animation: ground-shine var(--duration) linear forwards infinite;
        }
        .loader .ground div:after { --rx: 90deg; --ry: 90deg; --x: 0; --y: 177px; --z: 150px; }
        .loader .box { --x: 0; --y: 0; position: absolute; animation: var(--duration) linear forwards infinite; transform: translate(var(--x), var(--y)); }
        .loader .box div { background-color: var(--primary); width: 48px; height: 48px; position: relative; transform-style: preserve-3d; animation: var(--duration) ease forwards infinite; transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); }
        .loader .box div:before, .loader .box div:after { --rx: 90deg; --ry: 0deg; --z: 24px; --y: -24px; --x: 0; content: ""; position: absolute; background-color: inherit; width: inherit; height: inherit; transform: rotateX(var(--rx)) rotateY(var(--ry)) translate(var(--x), var(--y)) translateZ(var(--z)); filter: brightness(var(--b, 1.2)); }
        .loader .box div:after { --rx: 0deg; --ry: 90deg; --x: 24px; --y: 0; --b: 1.4; }
        .loader .box.box0 { --x: -220px; --y: -120px; left: 58px; top: 108px; }
        .loader .box.box1 { --x: -260px; --y: 120px;  left: 25px; top: 120px; }
        .loader .box.box2 { --x: 120px;  --y: -190px; left: 58px; top: 64px;  }
        .loader .box.box3 { --x: 280px;  --y: -40px;  left: 91px; top: 120px; }
        .loader .box.box4 { --x: 60px;   --y: 200px;  left: 58px; top: 132px; }
        .loader .box.box5 { --x: -220px; --y: -120px; left: 25px; top: 76px;  }
        .loader .box.box6 { --x: -260px; --y: 120px;  left: 91px; top: 76px;  }
        .loader .box.box7 { --x: -240px; --y: 200px;  left: 58px; top: 87px;  }
        .loader .box0 { animation-name: box-move0; } .loader .box0 div { animation-name: box-scale0; }
        .loader .box1 { animation-name: box-move1; } .loader .box1 div { animation-name: box-scale1; }
        .loader .box2 { animation-name: box-move2; } .loader .box2 div { animation-name: box-scale2; }
        .loader .box3 { animation-name: box-move3; } .loader .box3 div { animation-name: box-scale3; }
        .loader .box4 { animation-name: box-move4; } .loader .box4 div { animation-name: box-scale4; }
        .loader .box5 { animation-name: box-move5; } .loader .box5 div { animation-name: box-scale5; }
        .loader .box6 { animation-name: box-move6; } .loader .box6 div { animation-name: box-scale6; }
        .loader .box7 { animation-name: box-move7; } .loader .box7 div { animation-name: box-scale7; }
        @keyframes box-move0 { 12% { transform: translate(var(--x), var(--y)); } 25%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale0 { 6% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 14%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move1 { 16% { transform: translate(var(--x), var(--y)); } 29%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale1 { 10% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 18%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move2 { 20% { transform: translate(var(--x), var(--y)); } 33%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale2 { 14% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 22%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move3 { 24% { transform: translate(var(--x), var(--y)); } 37%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale3 { 18% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 26%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move4 { 28% { transform: translate(var(--x), var(--y)); } 41%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale4 { 22% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 30%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move5 { 32% { transform: translate(var(--x), var(--y)); } 45%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale5 { 26% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 34%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move6 { 36% { transform: translate(var(--x), var(--y)); } 49%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale6 { 30% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 38%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes box-move7 { 40% { transform: translate(var(--x), var(--y)); } 53%, 52% { transform: translate(0,0); } 80% { transform: translate(0,-32px); } 90%, 100% { transform: translate(0,188px); } }
        @keyframes box-scale7 { 34% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(0); } 42%, 100% { transform: rotateY(-47deg) rotateX(-15deg) rotateZ(15deg) scale(1); } }
        @keyframes ground { 0%, 65% { transform: rotateX(90deg) rotateY(0deg) translate(-48px,-120px) translateZ(100px) scale(0); } 75%, 90% { transform: rotateX(90deg) rotateY(0deg) translate(-48px,-120px) translateZ(100px) scale(1); } 100% { transform: rotateX(90deg) rotateY(0deg) translate(-48px,-120px) translateZ(100px) scale(0); } }
        @keyframes ground-shine { 0%, 70% { opacity: 0; } 75%, 87% { opacity: 0.2; } 100% { opacity: 0; } }
        @keyframes mask { 0%, 65% { opacity: 0; } 66%, 100% { opacity: 1; } }
    </style>
    <script>
        (function() {
            var loader = document.getElementById('page-loader');
            var loaderHidden = false;
            function hideLoader() {
                if (loaderHidden || !loader) return;
                loaderHidden = true;
                loader.classList.add('hidden');
                setTimeout(function() { if (loader.parentNode) loader.remove(); }, 550);
            }
            setTimeout(hideLoader, 6000);
            window.addEventListener('load', function() {
                fetch('/api/online/cloud_save', { method: 'POST' })
                    .then(hideLoader)
                    .catch(hideLoader);
            });
        })();
    </script>

    <audio id="bg-music" loop preload="auto" style="display:none;">
        <source src="/game_assets/music/main_theme_1.mp3" type="audio/mpeg">
    </audio>

    {% block content %}{% endblock %}

    <script src="/static/js/game.js"></script>
    <script src="/static/js/spa.js"></script>
    {% block extra_scripts %}{% endblock %}

    <div id="game-confirm-overlay" style="display:none;position:fixed;inset:0;width:100%;height:100%;min-height:100vh;background:rgba(0,0,0,0.82);z-index:10000;align-items:center;justify-content:center;overflow:hidden;" onclick="event.stopPropagation()">
        <div style="background:linear-gradient(160deg,rgba(24,14,6,0.99),rgba(14,8,2,0.99));border:1px solid rgba(200,165,90,0.42);border-radius:12px;padding:28px 28px 22px;max-width:380px;width:90%;box-shadow:0 8px 40px rgba(60,30,8,0.5);text-align:center;">
            <div id="game-confirm-msg" style="font-size:14px;color:var(--text-light);margin-bottom:22px;line-height:1.6;"></div>
            <div style="display:flex;gap:10px;justify-content:center;">
                <button id="game-confirm-ok" class="btn btn-danger" style="min-width:100px;">Confirm</button>
                <button id="game-confirm-cancel" class="btn btn-secondary" style="min-width:100px;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="settings-overlay" style="display:none;" onclick="settingsOverlayClick(event)">
        <div class="settings-panel panel">
            <div class="panel-title">Settings</div>
            <div class="panel-body settings-body">
                <div class="settings-section-label">Audio</div>
                <div class="settings-row">
                    <span class="settings-label">Music</span>
                    <button id="settings-music-toggle" class="btn btn-secondary btn-xsmall" onclick="settingsToggleMusic()">On</button>
                </div>
                <div class="settings-row">
                    <span class="settings-label">Volume</span>
                    <input type="range" id="settings-music-slider" min="0" max="100" value="30"
                           oninput="settingsSetVolume(this.value)" class="music-slider">
                    <span id="settings-music-vol" class="music-vol-label">30%</span>
                </div>
                <div class="settings-row">
                    <span class="settings-label">BGM Track</span>
                    <div style="display:flex;gap:5px;">
                        <button class="btn btn-secondary btn-xsmall bgm-track-btn" data-track="1" onclick="settingsChangeBGM('1')">1</button>
                        <button class="btn btn-secondary btn-xsmall bgm-track-btn" data-track="2" onclick="settingsChangeBGM('2')">2</button>
                        <button class="btn btn-secondary btn-xsmall bgm-track-btn" data-track="3" onclick="settingsChangeBGM('3')">3</button>
                    </div>
                </div>
                <div class="settings-section-label" style="margin-top:8px;">Background</div>
                <div class="settings-row settings-bg-row">
                    <button class="bg-option-btn btn btn-secondary btn-xsmall" data-bg="1" onclick="applyBackground('1')">BG 1</button>
                    <button class="bg-option-btn btn btn-secondary btn-xsmall" data-bg="2" onclick="applyBackground('2')">BG 2</button>
                    <button class="bg-option-btn btn btn-secondary btn-xsmall" data-bg="3" onclick="applyBackground('3')">BG 3</button>
                    <button class="bg-option-btn btn btn-secondary btn-xsmall" data-bg="4" onclick="applyBackground('4')">BG 4</button>
                    <button class="bg-option-btn btn btn-secondary btn-xsmall" data-bg="none" onclick="applyBackground('none')">None</button>
                </div>
                <div class="settings-section-label" style="margin-top:8px;">Display</div>
                <div class="settings-row">
                    <span class="settings-label">Fullscreen</span>
                    <button id="settings-fs-btn" class="btn btn-secondary btn-xsmall" onclick="settingsToggleFullscreen()">Go Fullscreen</button>
                </div>
                <div class="settings-section-label" style="margin-top:8px;">Interface</div>
                <div class="settings-row">
                    <span class="settings-label">Buttons</span>
                    <button id="settings-btn-style" class="btn btn-secondary btn-xsmall" onclick="settingsToggleButtonStyle()">Classic</button>
                </div>
                <div class="settings-section-label" style="margin-top:8px;">Theme &amp; Colours</div>
                <div class="settings-row settings-bg-row" style="flex-wrap:wrap;gap:5px;">
                    <button class="theme-option-btn btn btn-secondary btn-xsmall active" data-theme="default" onclick="applyTheme('default')">Default</button>
                    <button class="theme-option-btn btn btn-secondary btn-xsmall" data-theme="forest" onclick="applyTheme('forest')">Forest</button>
                    <button class="theme-option-btn btn btn-secondary btn-xsmall" data-theme="crimson" onclick="applyTheme('crimson')">Crimson</button>
                    <button class="theme-option-btn btn btn-secondary btn-xsmall" data-theme="midnight" onclick="applyTheme('midnight')">Midnight</button>
                    <button class="theme-option-btn btn btn-secondary btn-xsmall" data-theme="amethyst" onclick="applyTheme('amethyst')">Amethyst</button>
                </div>
            </div>
            <div class="settings-footer">
                <button class="btn btn-secondary btn-small" onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

    {% if online_username %}
    <style>
        #chat-widget .widget-fab:not(#chat-toggle-btn) { display: none !important; }
        #groups-overlay { display: none !important; }
        .widget-fab {
            width: 50px; height: 50px;
            background: var(--wood-dark);
            border: 2px solid var(--wood-bright);
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.55);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Tiny5', monospace;
            transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
            border-radius: 50%;
        }
        .widget-fab:hover { background: var(--wood-mid); transform: scale(1.08); box-shadow: 0 6px 20px rgba(0,0,0,0.65); }
        #chat-toggle-btn.chat-open { background: var(--wood-bright); box-shadow: 0 0 0 3px rgba(200,150,60,0.35), 0 4px 16px rgba(0,0,0,0.55); }
        #groups-overlay { display: none; position: fixed; inset: 0; z-index: 8500; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; }
        #groups-overlay-panel { width: min(980px,96vw); height: min(700px,92vh); background: var(--bg-panel); border: 2px solid var(--border); box-shadow: 4px 4px 0 rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; }
        #groups-overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; background: var(--wood-dark); border-bottom: 2px solid var(--border); flex-shrink: 0; }
        #groups-overlay iframe { flex: 1; width: 100%; border: none; background: var(--bg-main); }
        #chat-panel { pointer-events: none !important; }
        #chat-panel[style*="display: flex"], #chat-panel[style*="display:flex"] { pointer-events: auto !important; }
        #chat-panel button, #chat-panel iframe, #chat-panel * { pointer-events: auto !important; }
        #groups-overlay[style*="display: flex"], #groups-overlay[style*="display:flex"] { display: flex !important; pointer-events: auto !important; }
        #groups-overlay button, #groups-overlay iframe, #groups-overlay * { pointer-events: auto !important; }
    </style>
    <div id="groups-overlay" onclick="if(event.target===this)closeGroupsOverlay()">
        <div id="groups-overlay-panel">
            <div id="groups-overlay-header">
                <span style="font-size:13px;font-weight:700;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;">Adventure Group</span>
                <button onclick="closeGroupsOverlay()" style="background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;padding:0;">&times;</button>
            </div>
            <iframe id="groups-overlay-frame" src="" title="Adventure Group"></iframe>
        </div>
    </div>
    <div id="chat-widget" style="position:fixed;bottom:20px;right:20px;z-index:8000;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;">
        <div id="chat-panel" style="display:none;position:fixed;inset:0;z-index:8900;background:rgba(0,0,0,0.78);align-items:center;justify-content:center;">
            <div style="width:min(860px,98vw);height:min(700px,96vh);background:var(--bg-panel);border:2px solid var(--border);box-shadow:4px 4px 0 rgba(0,0,0,0.6);display:flex;flex-direction:column;overflow:hidden;">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--wood-dark);border-bottom:2px solid var(--border);flex-shrink:0;">
                    <span style="font-size:13px;font-weight:700;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;">
                        <img src="/game_assets/glyphs/chat.webp" alt="" style="width:20px;height:20px;image-rendering:pixelated;"> Global Chat
                    </span>
                    <button onclick="toggleChat()" style="background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;padding:0 2px;">&times;</button>
                </div>
                <iframe id="chat-widget-frame" src="" title="Global Chat" style="flex:1;width:100%;border:none;background:var(--bg-main);"></iframe>
            </div>
        </div>
        <button class="widget-fab" id="chat-toggle-btn" onclick="toggleChat()" title="Global Chat" style="pointer-events:all;">
            <img src="/game_assets/glyphs/chat.webp" alt="chat" style="width:22px;height:22px;image-rendering:pixelated;">
            <span id="chat-unread-badge" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;font-weight:700;border-radius:50%;"></span>
        </button>
    </div>
    {% endif %}

</body>
</html>
